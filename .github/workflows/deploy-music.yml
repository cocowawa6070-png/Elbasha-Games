name: Deploy Elbasha Global Music Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Locate Supabase function source in project ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/elbasha_games_android.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Upload the updated elbasha_games_android.zip to the repository root first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/elbasha-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/elbasha-project"
          CONFIG_FILE="$(find "$RUNNER_TEMP/elbasha-project" -path '*/supabase/config.toml' -print -quit)"
          if [[ -z "$CONFIG_FILE" ]]; then
            echo "::error::The ZIP does not contain supabase/config.toml."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$CONFIG_FILE")")"
          FUNCTION_FILE="$PROJECT_DIR/supabase/functions/global-music-storage/index.ts"
          if [[ ! -s "$FUNCTION_FILE" ]]; then
            echo "::error::The ZIP is missing supabase/functions/global-music-storage/index.ts."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Function source found: $FUNCTION_FILE"

      - name: Deploy global-music-storage
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Add repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF:-}" ]]; then
            echo "::error::Add repository secret SUPABASE_PROJECT_REF (full project ref, not an alias)."
            exit 1
          fi
          supabase functions deploy global-music-storage \
            --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_REF"
            

name: Build Elbasha Games APK

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$GITHUB_WORKSPACE/elbasha_games_android.zip"
            if [[ ! -f "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*elbasha*games*.zip' | sort | head -n 1)"
            fi
            if [[ -z "$ZIP_FILE" || ! -f "$ZIP_FILE" ]]; then
              echo "ERROR: Put settings.gradle.kts in the repository root or upload an Elbasha Games ZIP to the repository root."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/elbasha-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/elbasha-project"
            PROJECT_DIR="$(find "$RUNNER_TEMP/elbasha-project" -name settings.gradle.kts -printf '%h\n' | head -n 1)"
            if [[ -z "$PROJECT_DIR" ]]; then
              echo "ERROR: settings.gradle.kts was not found in the uploaded ZIP."
              exit 1
            fi
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project at: $PROJECT_DIR"

      - name: Validate Supabase public key configuration
        shell: bash
        run: |
          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "::error::Add the Supabase project URL as repository variable SUPABASE_URL before building this version."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Add the Supabase anon/publishable key as repository secret SUPABASE_ANON_KEY before building this version."
            exit 1
          fi

      - name: Validate player catalog and first-release scope
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate_catalog.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install build tools
        run: |
          # sdkmanager closes stdin after the final prompt; yes may then exit with SIGPIPE.
          # Preserve the sdkmanager exit code while tolerating that expected producer close.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            echo "Android SDK license acceptance failed with status $license_status"
            exit "$license_status"
          fi
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.4
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.14.4-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.14.4-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.14.4-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle version
        shell: bash
        run: |
          gradle --version | tee "$RUNNER_TEMP/gradle-version.txt"
          grep -Fq "Gradle 8.14.4" "$RUNNER_TEMP/gradle-version.txt"

      - name: Prepare APK signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/elbasha-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/elbasha-signing/elbasha-debug.keystore"
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" && -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$ANDROID_DEBUG_KEYSTORE_PASSWORD"
            echo "Signing mode: stable repository key"
          else
            # Keep the build/test pipeline usable before private GitHub secrets are configured.
            # Google Sign-In requires registering this generated certificate's SHA fingerprints;
            # for a stable Google login test, configure both repository secrets using SIGNING_SETUP.md.
            STORE_PASSWORD="android"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias elbasha-debug \
              -keypass "$STORE_PASSWORD" \
              -dname "CN=ELBASHA GAMES Debug,O=ELBASHA GAMES,C=EG" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "::warning::Stable signing secrets are not configured. This APK uses a temporary debug key; Google Sign-In will need its SHA fingerprint registered and the stable key configured for future updates."
          fi
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" -alias elbasha-debug \
            | grep -E 'SHA1:|SHA256:'

      - name: Run gameplay regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signing certificate
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elbasha-Games-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          

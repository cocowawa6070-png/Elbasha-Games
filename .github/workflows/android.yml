name: Unpack uploaded zip

on:
  push:
    paths:
      - "incoming/*.zip"

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip files from incoming/
        run: |
          set -e
          shopt -s nullglob
          for z in incoming/*.zip; do
            echo "Unpacking $z"
            unzip -o "$z" -x ".github/*" "__MACOSX/*" -d .
            git rm -q "$z"
          done

      - name: Validate project files
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          test -f app/build.gradle.kts
          echo "Project structure validated successfully"

      - name: Run unit tests
        run: |
          set -e
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Compile Android app
        run: |
          set -e
          ./gradlew assembleDebug

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack uploaded zip" || exit 0
          git push

      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref "${GITHUB_REF_NAME}"
        


name: Build Elbasha Games APK

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q elbasha_games_android.zip -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -80

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Get SHA-1 fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace signingReport

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elbasha-Games-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
